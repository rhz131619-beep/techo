  function addPhotos(files) {
    var room = 4 - S.photos.length;
    Array.prototype.slice.call(files, 0, room).forEach(function (f) {
      if (!/^image\//.test(f.type)) return;
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var sc = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          if (S.photos.length < 4) { S.photos.push(c.toDataURL("image/jpeg", 0.75)); drawPhotos(); }
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  }
  async function submitPost() {
    if (S.busy || !S.user) return;

    var price = parseFloat(v("p_price")); if (isNaN(price) || price <= 0) return err("Ingresa un precio válido.");
    var m2 = parseFloat(v("p_m2")); if (isNaN(m2) || m2 <= 0) return err("Ingresa la superficie en m².");
    if (desc.length < 20) return err("Agrega una descripción de al menos 20 caracteres.");

        bedrooms: parseInt(v("p_dorm"), 10), bathrooms: parseInt(v("p_banos"), 10), area_m2: m2,
        furnished: $("p_amoblado").checked, pets_allowed: $("p_mascotas").checked, has_garage: $("p_garaje").checked };
      var ins = await sb.from("properties").insert(row).select("*").single();
      if (ins.error) throw ins.error;
      var prop = ins.data, failed = 0, rows = [];
      for (var i = 0; i < S.photos.length; i++) {
        var path = S.user.id + "/" + uuid() + ".jpg";
        var up2 = await sb.storage.from(CONFIG.BUCKET).upload(path, dataUrlToBlob(S.photos[i]), { contentType: "image/jpeg", cacheControl: "31536000" });
        if (up2.error) { failed++; continue; }
        rows.push({ property_id: prop.id, path: path, position: i });

      if (rows.length) {

      prop.property_images = rows;

  }

    refreshView(); if (S.detail === id) redrawDetail();
    var p = on ? sb.from("favorites").delete().eq("property_id", id).eq("user_id", S.user.id) : sb.from("favorites").insert({ property_id: id });
    p.then(function (r) {
      if (r.error && !(r.error.code === "23505")) {
        if (on) S.favIds[id] = 1; else delete S.favIds[id];
        refreshView(); if (S.detail === id) redrawDetail();
        toast("No se pudo actualizar tu favorito.");
      } else toast(on ? "Quitado de favoritos" : "Guardado en favoritos");
    });
  }
  async function toggleStatus(id) {
    var it = cache[id]; if (!it || !isMine(it)) return;
    var next = it.status === "closed" ? "published" : "closed";
    var r = await sb.from("properties").update({ status: next }).eq("id", id).eq("owner_id", S.user.id);
    if (r.error) { toast(fe(r.error)); return; }
    it.status = next; toast(next === "closed" ? "Anuncio cerrado." : "Anuncio publicado de nuevo.");
    loadListings(); refreshView();
  }
  async function deleteListing(id) {
    var it = cache[id]; if (!it || !isMine(it)) return;
    var r = await sb.from("properties").delete().eq("id", id).eq("owner_id", S.user.id);
    if (r.error) { toast(fe(r.error)); return; }
    if (it.paths && it.paths.length) sb.storage.from(CONFIG.BUCKET).remove(it.paths);
    S.mineItems = S.mineItems.filter(function (x) { return x.id !== id; });
    items = items.filter(function (x) { return x.id !== id; });
    delete S.favIds[id]; delete cache[id]; S.delArm = null;
    toast("Anuncio eliminado."); refreshView();
  }

  /* ============ Render general ============ */
  function chrome() {
    var home = S.tab === "home";
    $("top").className = "top" + (home ? "" : " plain");
    $("city").style.display = home ? "" : "none";
    $("ptitle").textContent = home ? "" : { post: "Publicar anuncio", favs: "Favoritos", mine: "Mis anuncios" }[S.tab];
    var a = $("acct");
    if (S.user) {
      var nm = (S.profile && S.profile.display_name) || S.user.email || "U";
      a.textContent = String(nm).charAt(0).toUpperCase(); a.className = "acct in"; a.setAttribute("aria-label", "Mi cuenta");
    } else { a.textContent = "Ingresar"; a.className = "acct"; a.setAttribute("aria-label", "Ingresar o crear cuenta"); }
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.className = "tab" + (b.getAttribute("data-op") === S.op ? " on" : ""); });
    Array.prototype.forEach.call(document.querySelectorAll(".nav button"), function (b) { b.className = (b.getAttribute("data-tab") === S.tab ? "on " : "") + (b.getAttribute("data-tab") === "post" ? "plus" : ""); });
  }
  function view() {
    if (S.tab === "home") renderHome(); else if (S.tab === "post") renderPost(); else if (S.tab === "favs") renderFavs(); else renderMine();
  }
  function render() { chrome(); view(); }
  function refreshView() { chrome(); if (S.tab !== "post") view(); }
  function setTab(t) {
    S.tab = t; S.delArm = null; render(); window.scrollTo(0, 0);
    if (S.user) { if (t === "favs") loadFavItems(); if (t === "mine") loadMine(); }
  }

  /* ============ Eventos ============ */
  document.addEventListener("click", function (e) {
    var t = e.target, el;
    if ((el = t.closest("[data-fav]"))) { toggleFav(el.getAttribute("data-fav")); e.stopPropagation(); return; }
    if ((el = t.closest("[data-rmphoto]"))) { S.photos.splice(parseInt(el.getAttribute("data-rmphoto"), 10), 1); drawPhotos(); return; }
    if ((el = t.closest("[data-act]"))) { act(el.getAttribute("data-act"), el); return; }
    if ((el = t.closest("[data-postop]"))) { setPostOp(el.getAttribute("data-postop")); return; }
    if ((el = t.closest("[data-op]"))) { S.op = el.getAttribute("data-op"); render(); return; }
    if ((el = t.closest("[data-tab]"))) { setTab(el.getAttribute("data-tab")); return; }
    if ((el = t.closest("[data-f]"))) { S.f[el.getAttribute("data-f")] = el.getAttribute("data-v"); renderHome(); return; }
    if ((el = t.closest("[data-toggle]"))) { var k = el.getAttribute("data-toggle"); S.f[k] = !S.f[k]; renderHome(); return; }
    if (t.id === "sheet") { closeSheet(); return; }
    if ((el = t.closest("[data-open]"))) { openDetail(el.getAttribute("data-open")); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      if (e.target.id && /^a_/.test(e.target.id)) { authSubmit(); return; }
      var el = e.target.closest && e.target.closest("[data-open]"); if (el && e.target === el) openDetail(el.getAttribute("data-open"));
    }
    if (e.key === "Escape") { if ($("sheet").className) closeSheet(); else if (S.detail) closeDetail(); }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "p_photos") { addPhotos(e.target.files); e.target.value = ""; } });
  $("search").addEventListener("input", function (e) { S.q = e.target.value; if (S.tab === "home") renderHome(); });
  $("city").addEventListener("change", function (e) { S.city = e.target.value; renderHome(); });

  function act(a, el) {
    var id = S.detail;
    if (a === "back") closeDetail();
    else if (a === "close-sheet") closeSheet();
    else if (a === "acct") { if (S.user) openAccount(); else openAuth("login"); }
    else if (a === "goto-auth") openAuth(el.getAttribute("data-mode"));
    else if (a === "auth-tab") openAuth(el.getAttribute("data-mode"));
    else if (a === "auth-submit") authSubmit();
    else if (a === "auth-forgot") authForgot();
    else if (a === "newpass-submit") newPassSubmit();
    else if (a === "acct-save") acctSave();
    else if (a === "logout") { sb.auth.signOut().then(function () { closeSheet(); toast("Sesión cerrada."); }); }
    else if (a === "login-contact") openAuth("login", "Ingresa para ver el contacto del vendedor.");
    else if (a === "fav-detail") toggleFav(id);
    else if (a === "info-ant") infoAnt();
    else if (a === "info-safe") infoSafe();
    else if (a === "demo") openSheet("Anuncio de ejemplo", "<p>Este anuncio es parte de la demostración y no tiene un contacto real. Los anuncios reales muestran el WhatsApp del vendedor a los usuarios registrados.</p>");
    else if (a === "report") openReport();
    else if (a === "submit-report") submitReport();
    else if (a === "reload") loadListings();
    else if (a === "clear") { S.q = ""; $("search").value = ""; S.op = "todos"; S.f = { tipo: "todos", dorm: "any", amoblado: false, mascotas: false, garaje: false, sort: "new", cur: S.f.cur }; render(); }
    else if (a === "submit-post") submitPost();
    else if (a === "toggle-status") toggleStatus(el.getAttribute("data-id"));
    else if (a === "del") {
      var did = el.getAttribute("data-id");
      if (S.delArm === did) deleteListing(did); else { S.delArm = did; renderMine(); }
    }
  }

  render();
  loadListings();
})();
</script>
</body>
</html>
